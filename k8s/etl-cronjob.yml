apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-processing-etl
spec:
  # Every hour at minute 0. Change as needed.
  # Examples:
  # - "*/15 * * * *"  (every 15 minutes)
  # - "0 2 * * *"     (daily at 2am)
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: etl
              # Build and push your image, then set it here:
              #   docker build -t <registry>/data-processing-etl:latest .
              #   docker push <registry>/data-processing-etl:latest
              image: your-registry/data-processing-etl:latest
              imagePullPolicy: IfNotPresent
              # Default CMD runs `python main.py`, but you can be explicit:
              command: ["python", "main.py"]
              # Provide env vars via a Secret created outside of git, e.g.:
              #   kubectl create secret generic etl-secrets --from-env-file=.env
              envFrom:
                - secretRef:
                    name: etl-secrets


